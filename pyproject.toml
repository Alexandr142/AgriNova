[project]
name = "agri-nova"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alexandr142", email = "liketheluckyboss@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "earthaccess>=0.19.0",
    "folium>=0.20.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyproj>=3.8.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
    "streamlit-folium>=0.27.4",
    "xarray>=2026.9.0",
]

[project.scripts]
agri-nova = "agri-nova:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
