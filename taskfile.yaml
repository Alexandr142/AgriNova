version: '3'

tasks:
  setup:
    desc: Install dependencies using uv
    cmds:
      - uv sync

  run:
    desc: Run the Streamlit dashboard
    cmds:
      - uv run streamlit run src/agri_nova/app.py

  test:
    desc: Run unit tests
    cmds:
      - uv run pytest

  prefetch:
    desc: Pre-download POWER, soil, terrain, crop history and the regional block into data/processed (run before a demo)
    cmds:
      - uv run python -m agri_nova.prefetch --region
